  <section class="hero" aria-labelledby="photos-title">
    <div>
      <p class="hero-kicker">Acadiana</p>
      <h1 id="photos-title">Photos of Jewish Life in Acadiana</h1>
    </div>

  <main id="main" class="wrap">
    <article class="article">
      <p class="lede">A small, chronological gallery of photographs we have permission to show. More images will be added as rights allow.</p>

      <div class="photo-gallery">
        <figure class="photo-entry">
          <img
            src="assets/photos/heymann-store-1916.jpg"
            alt="Heymann’s storefront in Lafayette, with display windows and Trade Day banners, 1916"
            width="1920"
            height="714"
          >
          <figcaption>
            <p class="photo-caption">1916 — Maurice Heymann’s first store in Lafayette.</p>
            <p class="photo-credit">Historical photograph (public domain under site policy: photographs from 1930 and earlier).</p>
          </figcaption>
        </figure>

        <figure class="photo-entry">
          <img
            src="assets/photos/temple-emanuel-opelousas-c1930.jpg"
            alt="Brick Temple Emanuel synagogue on South Main Street in Opelousas, about 1930"
            width="960"
            height="552"
          >
          <figcaption>
            <p class="photo-caption">c. 1930 — Temple Emanuel, South Main Street, Opelousas, soon after construction.</p>
            <p class="photo-credit">Carola Lillie Hartley collection (via St. Landry Now); photograph c. 1930 (public domain under site policy).</p>
          </figcaption>
        </figure>

        <figure class="photo-entry">
          <img
            src="assets/photos/hebrew-rest-lafayette-2012.jpg"
            alt="Walkway and headstones under live oaks at Menachim Aveilim Jewish Cemetery in Lafayette, 2012"
            width="1600"
            height="1200"
          >
          <figcaption>
            <p class="photo-caption">2012 — Menachim Aveilim Jewish Cemetery (informally “Hebrew Rest”), Lafayette. Cemetery established 1869.</p>
            <p class="photo-credit">Photo by Natalie Maynor, <a href="https://creativecommons.org/licenses/by/2.0/">CC BY 2.0</a>. Source: <a href="https://commons.wikimedia.org/wiki/File:Hebrew_Rest_Cemetery_Lafayette,_Louisiana_January_2012.jpg">Wikimedia Commons</a>.</p>
          </figcaption>
        </figure>
      </div>
